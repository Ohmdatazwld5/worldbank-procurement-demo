[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbank-procurement-demo"
version = "1.0.0"
description = "Open-source multi-agent procurement decision-support demo"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["worldbank_demo_backend*"]

[tool.setuptools.package-data]
worldbank_demo_backend = ["static/*.html"]
